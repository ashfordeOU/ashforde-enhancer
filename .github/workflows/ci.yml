name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  mac:
    name: Build and set up for real (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build the app (ad hoc)
        run: scripts/build-app.sh
      - name: Set up, use and remove on this Mac
        run: |
          set -euo pipefail
          BIN="dist/Ashforde Enhancer.app/Contents/MacOS/AshfordeEnhancer"
          "$BIN" version
          STAGE="$(mktemp -d)"; chmod 700 "$STAGE"
          "$BIN" stage "$STAGE" > "$STAGE/install.sh"
          sudo /bin/sh "$STAGE/install.sh"
          echo "--- rule"; sudo cat /etc/sudoers.d/ashforde-lid; sudo visudo -c
          stat -f '%Su:%Sg %Lp' /etc/sudoers.d/ashforde-lid | grep -qx 'root:wheel 440'
          sudo launchctl print system/org.ashforde.enhancer.failsafe | head -5
          LID="$HOME/Library/Application Scripts/org.ashforde.monorail.appstore/ashforde-lid.sh"
          "$LID" status
          "$LID" on; pmset -g | grep -E 'SleepDisabled[[:space:]]+1'
          "$LID" status | grep -q '"sleepDisabled":true'
          # The fail-safe: no Ashforde app is running here, so it turns sleep back on.
          sudo /bin/sh /Library/PrivilegedHelperTools/org.ashforde.enhancer.failsafe
          pmset -g | grep -E 'SleepDisabled[[:space:]]+0'
          "$LID" on; "$LID" off; pmset -g | grep -E 'SleepDisabled[[:space:]]+0'
          # The fan helper (GitHub's Mac is a VM with no fans: status answers, auto has nothing to undo).
          FAN=/Library/PrivilegedHelperTools/ashforde-fan
          stat -f '%Su:%Sg %Lp' "$FAN" | grep -qx 'root:wheel 755'
          stat -f '%Su:%Sg %Lp' /etc/sudoers.d/ashforde-fan | grep -qx 'root:wheel 440'
          echo "--- fan rule"; sudo cat /etc/sudoers.d/ashforde-fan
          codesign --verify --strict "$FAN"
          FANSH="$HOME/Library/Application Scripts/org.ashforde.monorail/ashforde-fan.sh"
          "$FANSH" status | tee /dev/stderr | grep -q '"helper":1'
          "$LID" status | grep -q '"fan":true'
          "$FANSH" auto
          ! "$FANSH" set 0 99999
          ! "$FANSH" set 0 1 2
          ! sudo -n "$FAN" set 0 -5
          ! sudo -n "$FAN" set 10 2000
          ! "$FAN" auto  # needs root
          # The fail-safe hands the fans back when the helper had them and no Ashforde app is running.
          sudo touch /var/db/ashforde-fan.forced
          sudo /bin/sh /Library/PrivilegedHelperTools/org.ashforde.enhancer.failsafe
          test ! -e /var/db/ashforde-fan.forced
          "$BIN" status
          "$BIN" print-uninstall | sudo /bin/sh
          test ! -e /etc/sudoers.d/ashforde-lid
          test ! -e /etc/sudoers.d/ashforde-fan
          test ! -e /Library/PrivilegedHelperTools/ashforde-fan
          ! sudo launchctl print system/org.ashforde.enhancer.failsafe >/dev/null 2>&1
          echo "All good."
